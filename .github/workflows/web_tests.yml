name: Admin Webpage CI

on:
  push:
    branches: [ developing, main ]
  pull_request:
    branches: [ developing, main ]

jobs:
  test:
    name: Central Platform Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: annotation_db_test
          POSTGRES_USER: annotation_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Module Imports & Database Models
        run: |
          python -c "from controller.app.main import app; from controller.app.models import Base; print('FastAPI app & models imported successfully')"

      - name: Run Central Tests Suite
        env:
          DATABASE_URL: sqlite:///:memory:
          APP_SECRET_KEY: test-secret-key-1234567890-test
          BOOTSTRAP_ADMIN_TOKEN: test-token
        run: |
          pytest tests_central/ -v
