{% extends "base.html" %}
{% block title %}Sign In - Central Annotation Platform{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
  <div class="card">
    <h2 class="card-title" style="text-align: center; margin-bottom: 1.5rem;">Sign In</h2>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/dashboard/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
